<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">

   
   <!-- Jordan Jumpman -->
   <g transform="translate(150, 120)">
     <!-- Head -->
     <circle cx="-10" cy="-50" r="12" fill="#000000"/>
     
     <!-- Body -->
     <ellipse cx="-5" cy="-25" rx="8" ry="20" fill="#000000"/>
     
     <!-- Left arm (extended up holding ball) -->
     <ellipse cx="-25" cy="-35" rx="6" ry="15" transform="rotate(-45 -25 -35)" fill="#000000"/>
     
     <!-- Right arm -->
     <ellipse cx="10" cy="-20" rx="5" ry="12" transform="rotate(30 10 -20)" fill="#000000"/>
     
     <!-- Left leg (bent, jumping) -->
     <ellipse cx="-15" cy="0" rx="6" ry="18" transform="rotate(-20 -15 0)" fill="#000000"/>
     
     <!-- Right leg (extended) -->
     <ellipse cx="5" cy="10" rx="6" ry="20" transform="rotate(15 5 10)" fill="#000000"/>
     
     <!-- Basketball -->
     <circle cx="-35" cy="-55" r="8" fill="none" stroke="#000000" stroke-width="2"/>
     <path d="M-35,-63 L-35,-47" stroke="#000000" stroke-width="1"/>
     <path d="M-43,-55 L-27,-55" stroke="#000000" stroke-width="1"/>
     <path d="M-40,-60 Q-35,-58 -30,-60" stroke="#000000" stroke-width="1" fill="none"/>
     <path d="M-40,-50 Q-35,-52 -30,-50" stroke="#000000" stroke-width="1" fill="none"/>
   </g>
   
   <!-- JORDAN text -->
   <text x="150" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">JORDAN</text>
 </svg>